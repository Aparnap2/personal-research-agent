[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[tool.mypy.packages]
"backend" = "ignore-missing-imports"
"backend.utils" = "allow"
"backend.tools" = "allow"
"backend.agent" = "allow"
